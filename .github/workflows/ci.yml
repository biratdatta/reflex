name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the extension
        run: npm run build:extension

      - name: Build the demo service
        run: npm run build:demo

      # Proof the loadable artefact still assembles, and a place to grab it from
      # for any commit without building locally.
      - name: Package the extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: reflex-extension
          path: release/*.zip
          if-no-files-found: error
